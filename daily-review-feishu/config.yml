# config.yml - daily-review-feishu 配置文件
# 首次安装请参考 INSTALL.md 完成配置
# 用户称呼从 agent workspace 根目录下的 USER.md 读取，无需在此配置

# 触发时间（修改后需重新注册 cron，且 --schedule 参数值必须与此保持一致）
schedule:
  daily: "50 23 * * *"         # 日总结
  weekly: "10 0 * * 1"         # 周复盘

# 飞书文件夹 token（由 INSTALL.md 第一步自动填入）
storage:
  backend: feishu
  daily_summary_folder_token: W4CufpHOll9UKcd6g4ycg5PNnwg   # 每日总结文件夹
  weekly_review_folder_token: QbKAfs8Vsl3vCHdDKrBcgLu5nBc   # 每周复盘文件夹
  domain: "https://qima.feishu.cn"

# 周评分 Bitable（必填，enabled 默认 true）
score_table:
  enabled: true
  app_token: N1shb3MAOanKrlsXW65csIy8nOe
  table_id: tblJtiGdXId7CoVd
