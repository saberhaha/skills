[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pay-opcenter-tools"
version = "0.1.0"
description = "支付运营平台 AI Skill 工具集"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
]

[tool.setuptools.packages.find]
include = ["shared*", "scripts*"]
